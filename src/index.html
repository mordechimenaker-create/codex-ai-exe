<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex AI Terminal</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="title">Codex AI Terminal</div>
        <div class="subtitle">Chat above, WSL below</div>
        <div class="status" id="statusLine">Ready</div>
        <div class="status meta" id="statusMeta">WSL: Unknown · --:--</div>
        <div class="actions">
          <button id="toggleTheme" class="ghost">Theme</button>
          <button id="toggleDensity" class="ghost">Density</button>
          <button id="jumpTerminal" class="ghost">Terminal</button>
          <button id="startImprove" class="send">Improve x5</button>
        </div>
      </header>

      <section class="chat-panel">
        <div class="chat-row">
          <div id="chat" class="chat"></div>
          <aside class="side-panel">
            <div class="side-title">Command History</div>
            <div id="cmdHistory" class="side-list"></div>
          </aside>
        </div>
        <div class="composer">
          <div class="controls">
            <button id="clearChat" class="ghost">Clear</button>
            <button id="send" class="send">Send</button>
          </div>
          <textarea id="prompt" class="prompt" rows="3" placeholder="Ask Codex..."></textarea>
        </div>
      </section>

      <section class="terminal-panel" id="terminalPanel">
        <div class="terminal-header">WSL Bash</div>
        <div id="terminal" class="terminal"></div>
      </section>
    </div>

    <div id="consentModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-title">Allow Auto-Run?</div>
        <div class="modal-body">
          The AI can run terminal commands automatically. Allow this?
        </div>
        <div class="modal-actions">
          <button id="consentAllow" class="send">Allow</button>
          <button id="consentDecline" class="ghost">Decline</button>
        </div>
      </div>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
