<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex AI Terminal</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="title">Codex AI Terminal</div>
        <div class="subtitle">צ'אט למעלה, טרמינל WSL למטה</div>
        <div class="status" id="statusLine">מוכן</div>
        <div class="status meta" id="statusMeta">WSL: לא ידוע · --:--</div>
        <div class="actions">
          <button id="toggleTheme" class="ghost">ערכת צבע</button>
          <button id="toggleDensity" class="ghost">צפיפות</button>
          <button id="jumpTerminal" class="ghost">טרמינל</button>
          <button id="startImprove" class="send">שפר x5</button>
          <button id="toggleRtl" class="ghost" aria-label="Toggle RTL">RTL</button>
          <button id="fontDown" class="ghost" aria-label="Decrease font size">א-</button>
          <button id="fontUp" class="ghost" aria-label="Increase font size">א+</button>
        </div>
      </header>

      <section class="chat-panel">
        <div class="chat-row">
          <div id="chat" class="chat"></div>
          <aside class="side-panel">
            <div class="side-title">פעולות מהירות</div>
            <div class="quick-actions">
              <button class="ghost quick" data-task="עדכן והתקן עדכונים (sudo apt update && sudo apt upgrade -y)">עדכון מערכת</button>
              <button class="ghost quick" data-task="נקה קבצים זמניים ומטמון בצורה בטוחה">ניקוי קבצים</button>
              <button class="ghost quick" data-task="בדוק שימוש בדיסק והצג את התיקיות הגדולות ביותר">בדיקת דיסק</button>
              <button class="ghost quick" data-task="בדוק חיבור אינטרנט ופתרון בעיות DNS">בדיקת רשת</button>
            </div>
            <div class="side-title">היסטוריית פקודות</div>
            <div id="cmdHistory" class="side-list"></div>
          </aside>
        </div>
        <div class="composer">
          <div class="controls">
            <button id="clearChat" class="ghost">נקה צ'אט</button>
            <button id="send" class="send">שלח</button>
          </div>
          <textarea id="prompt" class="prompt" rows="3" placeholder="כתוב מה אתה רוצה שאעשה..."></textarea>
        </div>
      </section>

      <section class="terminal-panel" id="terminalPanel">
        <div class="terminal-header">WSL Bash</div>
        <div id="terminal" class="terminal"></div>
      </section>
    </div>

    <div id="consentModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-title">לאשר הרצה אוטומטית?</div>
        <div class="modal-body">
          ה‑AI יכול להריץ פקודות בטרמינל באופן אוטומטי. לאשר?
        </div>
        <div class="modal-actions">
          <button id="consentAllow" class="send">אשר</button>
          <button id="consentDecline" class="ghost">דחה</button>
        </div>
      </div>
    </div>

    <div id="dangerModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-title">אישור נוסף לפקודה מסוכנת</div>
        <div class="modal-body" id="dangerText"></div>
        <div class="modal-actions">
          <button id="dangerAllow" class="send">הרץ בכל זאת</button>
          <button id="dangerDecline" class="ghost">בטל</button>
        </div>
      </div>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
